<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Work in Progress</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(
        135deg,
        #bbdefb 0%,
        #90caf9 50%,
        #64b5f6 100%
      );
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      background: white;
      padding: 50px 60px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 80, 150, 0.15);
      margin: 20px;
    }

    h1 {
      color: #1976d2;
      font-size: 42px;
      margin: 0 0 12px;
    }

    p {
      color: #607d8b;
      font-size: 18px;
      margin: 0;
    }

    @media (max-width: 600px) {
      .card {
        padding: 40px 30px;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <main class="card">
    <h1>Work in Progress</h1>
    <p>Something great is coming soon.</p>
  </main>

</body>
</html>
